name: Crear APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Extraer proyecto
        run: |
          mkdir proyecto
          unzip -q *.zip -d proyecto
          echo "Archivos extraídos:"
          find proyecto -maxdepth 3 -type f | head -100

      - name: Buscar Gradle
        run: |
          GRADLEW=$(find proyecto -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "No se encontró gradlew"
            exit 1
          fi
          chmod +x "$GRADLEW"
          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PlasticMax-APK
          path: proyecto/**/build/outputs/apk/**/*.apk
